<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheWarWithin - 내전 팀 밸런스 메이커</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/player-list-styles.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #858796;
            --success-color: #1cc88a;
            --info-color: #36b9cc;
            --warning-color: #f6c23e;
            --danger-color: #e74a3b;
            --light-color: #f8f9fc;
            --dark-color: #5a5c69;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fc;
            color: #5a5c69;
            font-size: 13px;
        }

        .card {
            border: none;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            margin-bottom: 1.5rem;
        }

        .card-header {
            background-color: #f8f9fc;
            border-bottom: 1px solid #e3e6f0;
            font-weight: 700;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }

        /* 포지션 슬롯 스타일 */
        .position-slots {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .position-slot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid transparent;
            background-color: #f8f9fa;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .position-slot:hover {
            background-color: #e9ecef;
            transform: translateY(-1px);
        }

        .position-slot.filled {
            border-color: #28a745;
            background-color: #d4edda;
        }

        .position-slot.next-to-fill {
            border-color: #ffc107;
            background-color: #fff3cd;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 193, 7, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 193, 7, 0);
            }
        }

        .position-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: #495057;
        }

        .player-name {
            font-weight: 500;
            color: #212529;
        }

        .position-slot.filled .player-name {
            color: #155724;
            font-weight: bold;
        }

        /* 세로 대기석 스타일 */
        .waiting-area-vertical {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 261px;
            padding: 6px;
            justify-content: flex-start;
        }

        .waiting-player-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background-color: #6c757d;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .waiting-player-btn:hover {
            background-color: #5a6268;
            transform: translateY(-1px);
        }

        .waiting-player-btn.clickable {
            background-color: #007bff;
        }

        .waiting-player-btn.clickable:hover {
            background-color: #0056b3;
        }

        /* 팀 2 대기석 버튼 색상 */
        #team2Waiting .waiting-player-btn.clickable {
            background-color: #dc3545;
        }

        #team2Waiting .waiting-player-btn.clickable:hover {
            background-color: #c82333;
        }

        /* 세로 대기석 버튼 스타일 */
        .waiting-area-vertical .waiting-player-btn {
            width: 100%;
            margin-bottom: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        /* 대기석 카드 헤더 스타일 강화 */
        .card-header.bg-danger {
            background-color: #dc3545 !important;
            border-bottom: 1px solid #c82333;
        }


        /* 드래그 앤 드롭 스타일 */
        .position-slot.filled {
            cursor: grab;
        }

        .position-slot.filled:active {
            cursor: grabbing;
        }

        .position-slot.drag-over {
            border-color: #007bff;
            background-color: #cce7ff;
            transform: scale(1.02);
        }

        /* 교체 하이라이트 애니메이션 */
        @keyframes swap-highlight {

            0%,
            100% {
                background-color: #ffc107;
                box-shadow: 0 0 15px rgba(255, 193, 7, 0.6);
            }

            50% {
                background-color: #fd7e14;
                box-shadow: 0 0 20px rgba(253, 126, 20, 0.8);
            }
        }

        @keyframes swap-highlight-team2 {

            0%,
            100% {
                background-color: #17a2b8;
                box-shadow: 0 0 15px rgba(23, 162, 184, 0.6);
            }

            50% {
                background-color: #20c997;
                box-shadow: 0 0 20px rgba(32, 201, 151, 0.8);
            }
        }

        /* 대기석 영역 드래그 오버 스타일 (포지션에서 돌아오는 플레이어용) */
        .waiting-area-vertical.drag-over {
            background-color: rgba(40, 167, 69, 0.1) !important;
            border: 2px dashed #28a745 !important;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(40, 167, 69, 0.2);
            animation: pulse-waiting 1.5s infinite;
        }

        @keyframes pulse-waiting {
            0% {
                background-color: rgba(40, 167, 69, 0.1);
                border-color: #28a745;
            }

            50% {
                background-color: rgba(40, 167, 69, 0.2);
                border-color: #20c997;
            }

            100% {
                background-color: rgba(40, 167, 69, 0.1);
                border-color: #28a745;
            }
        }

        /* 플레이어 선택 버튼 스타일 - 개선된 디자인 */
        .player-select-btn {
            padding: 10px 20px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .player-select-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .player-select-btn:hover::before {
            left: 100%;
        }

        .player-select-btn:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .player-select-btn:active {
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* 선택된 플레이어 버튼 스타일 */
        .player-select-btn.selected {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            animation: selectedPulse 2s ease-in-out infinite;
        }

        .player-select-btn.selected:hover {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.6);
        }

        @keyframes selectedPulse {

            0%,
            100% {
                box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            }

            50% {
                box-shadow: 0 6px 25px rgba(16, 185, 129, 0.6);
            }
        }

        /* 탭 스타일 개선 */
        #playerPickerTabs .nav-link {
            color: #6c757d;
            font-weight: 600;
            border: none;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            padding: 12px 24px;
        }

        #playerPickerTabs .nav-link:hover {
            color: #667eea;
            border-bottom-color: rgba(102, 126, 234, 0.3);
            background-color: rgba(102, 126, 234, 0.05);
        }

        #playerPickerTabs .nav-link.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background-color: rgba(102, 126, 234, 0.1);
        }

        /* 탭 컨텐츠 애니메이션 */
        .tab-pane {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 플레이어 목록 컨테이너 스타일 */
        #playerPickerTabContent {
            background: linear-gradient(to bottom, #f8f9fa, #ffffff);
            border-radius: 0 0 8px 8px;
        }

        /* 플레이어 목록 그리드 레이아웃 */
        #frequentPlayersList,
        #allPlayersList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        /* 스크롤바 스타일 */
        #playerPickerTabContent::-webkit-scrollbar {
            width: 8px;
        }

        #playerPickerTabContent::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        #playerPickerTabContent::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        #playerPickerTabContent::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        /* 입력창 스타일 개선 */
        #playersInput {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        #playersInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        /* 카드 애니메이션 */
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        /* 포지션 아이콘 스타일 */
        .position-icon {
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
        }

        /* 포지션 텍스트 대체 스타일 */
        .position-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: #c8aa6e;
        }

        /* 최근 폼 스타일 */
        .recent-form {
            display: inline-flex;
            gap: 2px;
            margin-left: 8px;
        }

        .form-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .form-dot.win {
            background-color: #28a745;
        }

        .form-dot.loss {
            background-color: #dc3545;
        }

        /* 상성 배지 스타일 */
        .synergy-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 4px;
        }

        .synergy-badge.duo {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.4);
        }

        .synergy-badge.nemesis {
            background: linear-gradient(135deg, #8b0000, #dc143c);
            color: #fff;
            box-shadow: 0 2px 8px rgba(220, 20, 60, 0.4);
        }

        /* 매치 히스토리 스타일 - 그룹핑 카드 UI */
        .match-group {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
            padding: 8px;
            position: relative;
            overflow: hidden;
        }

        .match-group:last-child {
            margin-bottom: 0;
        }

        .group-timeline {
            display: none;
        }

        .match-row {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .match-row:hover {
            background: #f8f9fc;
            transform: translateX(2px);
        }

        .match-round {
            flex: 0 0 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-right: 12px;
        }

        .round-number {
            width: 28px;
            height: 28px;
            background: #4e73df;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }

        .match-date {
            font-size: 1.15rem;
            font-weight: 700;
            color: #495057;
            white-space: nowrap;
        }

        .match-team {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .win-team {
            background: #ECFDF5;
        }

        .lose-team {
            background: #FFF1F2;
        }

        .left-team {
            justify-content: flex-start;
        }

        .right-team {
            justify-content: flex-end;
            text-align: right;
        }

        .team-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .team-badge.win {
            background: #10B981;
            color: white;
        }

        .team-badge.lose {
            background: #EF4444;
            color: white;
        }

        .team-players {
            font-size: 1.05rem;
            line-height: 1.4;
        }

        .win-team .team-players {
            color: #111827;
            font-weight: 600;
        }

        .lose-team .team-players {
            color: #EF4444;
            font-weight: 400;
        }

        .match-vs {
            flex: 0 0 50px;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            color: #9CA3AF;
        }

        /* 통계 컨테이너 스타일 */
        .stats-container {
            align-items: stretch;
        }

        .stats-table {
            overflow: hidden;
        }

        .stats-table .table {
            font-size: 1.05rem;
            margin-bottom: 0;
        }

        .stats-table .table th,
        .stats-table .table td {
            padding: 0.4rem 0.25rem;
            white-space: nowrap;
        }

        .stats-chart .card {
            margin-bottom: 0;
        }

        .stats-chart .chart-container {
            min-height: 300px;
        }

        /* 반응형 - 통계 레이아웃 */
        @media (max-width: 992px) {
            .stats-container {
                flex-direction: column;
            }

            .stats-chart {
                width: 100% !important;
            }

            .stats-chart .chart-container {
                height: 250px !important;
            }
        }

        /* 반응형 - 모바일 */
        @media (max-width: 768px) {
            .match-row {
                flex-wrap: wrap;
            }

            .match-round {
                flex: 0 0 100%;
                flex-direction: row;
                justify-content: flex-start;
                gap: 8px;
                padding-bottom: 8px;
            }

            .match-team {
                flex: 1 1 45%;
            }

            .match-vs {
                flex: 0 0 10%;
            }

            .group-timeline {
                display: none;
            }
        }

        /* 이미지 캡처 버튼 스타일 */
        .capture-btn {
            position: absolute;
            top: -5px;
            right: 0;
            z-index: 10;
        }

        .team-roster-container {
            position: relative;
        }

        /* 복사 상태 메시지 */
        #copyStatus {
            position: absolute;
            top: 30px;
            right: 0;
            z-index: 10;
        }

        /* MVP/ACE 모달 스타일 */
        .mvp-player-btn, .ace-player-btn {
            padding: 12px 20px;
            margin: 5px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mvp-player-btn:hover {
            border-color: #9333EA;
            background: #f3e8ff;
        }

        .mvp-player-btn.selected {
            border-color: #9333EA;
            background: #9333EA;
            color: #fff;
            font-weight: 600;
        }

        .ace-player-btn:hover {
            border-color: #10B981;
            background: #d1fae5;
        }

        .ace-player-btn.selected {
            border-color: #10B981;
            background: #10B981;
            color: #fff;
            font-weight: 600;
        }

        /* 매치 히스토리 awards 스타일 */
        .match-awards {
            display: flex;
            gap: 8px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-gamepad me-2"></i>
                TheWarWithin
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#team-builder">팀짜기</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#overview">개요</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#statistics">통계표</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#charts">차트</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#players">플레이어</a>
                    </li>
                </ul>
                <div class="ms-auto">
                    <button class="btn btn-outline-light btn-sm" id="refreshBtn" onclick="refreshData()">
                        <i class="fas fa-sync me-1"></i>새로고침
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Loading -->
        <div id="loading" class="loading">
            <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
            <p>데이터를 불러오는 중...</p>
        </div>

        <!-- Content -->
        <div id="content" style="display: none;">
            <!-- Team Builder Section -->
            <section id="team-builder" class="mb-5">
                <h2 class="mb-4">
                    <i class="fas fa-random me-2"></i>
                    팀 짜기
                </h2>
                <div class="row">
                    <!-- 10명 입력 -->
                    <div class="col-md-12 mb-4">
                        <div class="card">
                            <div class="card-header bg-info text-white">
                                <h5 class="mb-0">
                                    <i class="fas fa-users me-2"></i>참가자 입력 (10명)
                                </h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <!-- 플레이어 이름 입력 -->
                                    <div class="col-md-3 mb-3">
                                        <label for="playersInput" class="form-label">
                                            플레이어 이름 (10명)
                                        </label>
                                        <textarea class="form-control" id="playersInput" rows="10" placeholder="플레이어1
플레이어2
플레이어3
플레이어4
플레이어5
플레이어6
플레이어7
플레이어8
플레이어9
플레이어10"></textarea>
                                    </div>

                                    <!-- 플레이어 선택 UI -->
                                    <div class="col-md-9 mb-3">
                                        <label class="form-label">플레이어 선택 (클릭하여 추가)</label>
                                        <!-- 탭 네비게이션 -->
                                        <ul class="nav nav-tabs" id="playerPickerTabs" role="tablist">
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link active" id="frequent-tab" data-bs-toggle="tab"
                                                    data-bs-target="#frequent-players" type="button" role="tab">
                                                    자주함
                                                </button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="all-tab" data-bs-toggle="tab"
                                                    data-bs-target="#all-players" type="button" role="tab">
                                                    전체
                                                </button>
                                            </li>
                                        </ul>
                                        <!-- 탭 컨텐츠 -->
                                        <div class="tab-content border border-top-0 p-3" id="playerPickerTabContent"
                                            style="height: 205px; overflow-y: auto;">
                                            <div class="tab-pane fade show active" id="frequent-players" role="tabpanel">
                                                <div id="frequentPlayersList" class="d-flex flex-wrap gap-2">
                                                    <!-- 자주함 플레이어 버튼들이 여기에 동적 생성 -->
                                                </div>
                                            </div>
                                            <div class="tab-pane fade" id="all-players" role="tabpanel">
                                                <div id="allPlayersList" class="d-flex flex-wrap gap-2">
                                                    <!-- 전체 플레이어 버튼들이 여기에 동적 생성 -->
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-center">
                                    <button type="button" class="btn btn-primary btn-lg" id="generateTeamsBtn">
                                        <i class="fas fa-random me-2"></i>랜덤 팀 생성
                                    </button>
                                    <button type="button" class="btn btn-outline-danger btn-lg ms-2" id="resetTeamBuilderBtn">
                                        <i class="fas fa-undo me-2"></i>전체 취소
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 랜덤 팀 결과 -->
                <div class="team-roster-container">
                    <button type="button" class="btn btn-outline-secondary btn-sm capture-btn" id="captureTeamBtn" style="display: none;">
                        <i class="fas fa-copy me-1"></i>이미지로 복사
                    </button>
                    <div id="generatedTeams" class="row justify-content-center align-items-start" style="display: none;">
                    <!-- 팀 1 대기석 -->
                    <div class="col-md-2 mb-4 d-flex justify-content-center" style="margin-top: 40px;">
                        <div class="card h-100" style="width: 140px;">
                            <div class="card-header bg-primary text-white text-center py-2">
                                <h6 class="mb-0 small">팀 1 대기석</h6>
                            </div>
                            <div class="card-body p-2 d-flex flex-column" id="team1WaitingSection">
                                <div id="team1Waiting" class="waiting-area-vertical flex-grow-1">
                                    <!-- 대기중인 플레이어 버튼들이 여기에 동적 생성 -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 팀 1 -->
                    <div class="col-md-3 mb-4">
                        <div class="card" style="height: 430px;">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0 text-end">
                                    팀 1<i class="fas fa-users ms-2"></i>
                                </h5>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <!-- 라인 배치 영역 -->
                                <div class="mb-3 flex-grow-1">
                                    <h6 class="mb-2 text-center">라인 배치</h6>
                                    <div id="team1Positions" class="position-slots">
                                        <div class="position-slot pos-top" data-position="0" data-team="team1">
                                            <span class="position-name"><img src="img/positions/Top.svg" alt="탑" class="position-icon" onerror="this.outerHTML='<span class=\'position-text\'>탑</span>'"></span>
                                            <span class="player-name">-</span>
                                        </div>
                                        <div class="position-slot pos-jungle" data-position="1" data-team="team1">
                                            <span class="position-name"><img src="img/positions/Jug.svg" alt="정글" class="position-icon" onerror="this.outerHTML='<span class=\'position-text\'>정글</span>'"></span>
                                            <span class="player-name">-</span>
                                        </div>
                                        <div class="position-slot pos-mid" data-position="2" data-team="team1">
                                            <span class="position-name"><img src="img/positions/Mid.svg" alt="미드" class="position-icon" onerror="this.outerHTML='<span class=\'position-text\'>미드</span>'"></span>
                                            <span class="player-name">-</span>
                                        </div>
                                        <div class="position-slot pos-adc" data-position="3" data-team="team1">
                                            <span class="position-name"><img src="img/positions/Bot.svg" alt="원딜" class="position-icon" onerror="this.outerHTML='<span class=\'position-text\'>원딜</span>'"></span>
                                            <span class="player-name">-</span>
                                        </div>
                                        <div class="position-slot pos-support" data-position="4" data-team="team1">
                                            <span class="position-name"><img src="img/positions/Sup.svg" alt="서폿" class="position-icon" onerror="this.outerHTML='<span class=\'position-text\'>서폿</span>'"></span>
                                            <span class="player-name">-</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-grid mt-auto">
                                    <button type="button" class="btn btn-success btn-lg" id="team1WinBtnNew"
                                        style="display: none;">
                                        <i class="fas fa-trophy me-2"></i>팀 1 승리
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 팀 2 -->
                    <div class="col-md-3 mb-4">
                        <div class="card" style="height: 430px;">
                            <div class="card-header bg-danger text-white">
                                <h5 class="mb-0">
                                    <i class="fas fa-users me-2"></i>팀 2
                                </h5>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <!-- 라인 배치 영역 -->
                                <div class="mb-3 flex-grow-1">
                                    <h6 class="mb-2 text-center">라인 배치</h6>
                                    <div id="team2Positions" class="position-slots">
                                        <div class="position-slot pos-top team2-reversed" data-position="0"
                                            data-team="team2">
                                            <span class="player-name">-</span>
                                            <span class="position-name"><img src="img/positions/Top.svg" alt="탑" class="position-icon" onerror="this.outerHTML='<span class=\'position-text\'>탑</span>'"></span>
                                        </div>
                                        <div class="position-slot pos-jungle team2-reversed" data-position="1"
                                            data-team="team2">
                                            <span class="player-name">-</span>
                                            <span class="position-name"><img src="img/positions/Jug.svg" alt="정글" class="position-icon" onerror="this.outerHTML='<span class=\'position-text\'>정글</span>'"></span>
                                        </div>
                                        <div class="position-slot pos-mid team2-reversed" data-position="2"
                                            data-team="team2">
                                            <span class="player-name">-</span>
                                            <span class="position-name"><img src="img/positions/Mid.svg" alt="미드" class="position-icon" onerror="this.outerHTML='<span class=\'position-text\'>미드</span>'"></span>
                                        </div>
                                        <div class="position-slot pos-adc team2-reversed" data-position="3"
                                            data-team="team2">
                                            <span class="player-name">-</span>
                                            <span class="position-name"><img src="img/positions/Bot.svg" alt="원딜" class="position-icon" onerror="this.outerHTML='<span class=\'position-text\'>원딜</span>'"></span>
                                        </div>
                                        <div class="position-slot pos-support team2-reversed" data-position="4"
                                            data-team="team2">
                                            <span class="player-name">-</span>
                                            <span class="position-name"><img src="img/positions/Sup.svg" alt="서폿" class="position-icon" onerror="this.outerHTML='<span class=\'position-text\'>서폿</span>'"></span>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-grid mt-auto">
                                    <button type="button" class="btn btn-success btn-lg" id="team2WinBtnNew"
                                        style="display: none;">
                                        <i class="fas fa-trophy me-2"></i>팀 2 승리
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 팀 2 대기석 -->
                    <div class="col-md-2 mb-4 d-flex justify-content-center" style="margin-top: 40px;">
                        <div class="card h-100" style="width: 140px;">
                            <div class="card-header bg-danger text-white text-center py-2">
                                <h6 class="mb-0 small">팀 2 대기석</h6>
                            </div>
                            <div class="card-body p-2 d-flex flex-column" id="team2WaitingSection">
                                <div id="team2Waiting" class="waiting-area-vertical flex-grow-1">
                                    <!-- 대기중인 플레이어 버튼들이 여기에 동적 생성 -->
                                </div>
                            </div>
                        </div>
                    </div>
                    </div>
                </div>
            </section>

            <!-- Match History Section -->
            <section id="match-history" class="mb-5">
                <h2 class="mb-4">
                    <i class="fas fa-history me-2"></i>
                    최근 경기 기록
                </h2>
                <div class="card">
                    <div class="card-body p-0" id="matchHistoryList">
                        <div class="text-center text-muted p-4">
                            <i class="fas fa-spinner fa-spin me-2"></i>경기 기록을 불러오는 중...
                        </div>
                    </div>
                </div>
            </section>

            <!-- MVP/ACE 투표 모달 -->
            <div class="modal fade" id="mvpModal" tabindex="-1" aria-labelledby="mvpModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content">
                        <div class="modal-header bg-warning">
                            <h5 class="modal-title" id="mvpModalLabel">
                                <i class="fas fa-trophy me-2"></i>MVP / ACE 선택
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="row">
                                <!-- MVP 선택 (승리팀) -->
                                <div class="col-md-6 mb-3">
                                    <h6 class="text-center text-success mb-2">
                                        <i class="fas fa-crown me-1"></i>MVP (승리팀)
                                    </h6>
                                    <div id="mvpPlayerList" class="d-flex flex-wrap justify-content-center">
                                        <!-- MVP 선택 버튼들이 여기에 동적 생성 -->
                                    </div>
                                </div>
                                <!-- ACE 선택 (패배팀) -->
                                <div class="col-md-6 mb-3">
                                    <h6 class="text-center text-danger mb-2">
                                        <i class="fas fa-medal me-1"></i>ACE (패배팀)
                                    </h6>
                                    <div id="acePlayerList" class="d-flex flex-wrap justify-content-center">
                                        <!-- ACE 선택 버튼들이 여기에 동적 생성 -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                            <button type="button" class="btn btn-warning" id="confirmMvpBtn" disabled>
                                <i class="fas fa-check me-1"></i>확정
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Overview Section -->
            <section id="overview" class="mb-5">
                <h2 class="mb-4">
                    <i class="fas fa-chart-line me-2"></i>
                    전체 현황
                </h2>
                <div class="row" id="overviewStats">
                    <!-- 동적으로 생성 -->
                </div>
            </section>

            <!-- Statistics Section (Table + Chart) -->
            <section id="statistics" class="mb-5">
                <h2 class="mb-4">
                    <i class="fas fa-table me-2"></i>
                    통계표
                </h2>
                <div class="stats-container d-flex gap-3">
                    <!-- 통계표 -->
                    <div class="stats-table flex-grow-1" style="min-width: 0;">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0" id="statsTable">
                                <!-- 동적으로 생성 -->
                            </table>
                        </div>
                    </div>
                    <!-- 차트 -->
                    <div id="charts" class="stats-chart" style="width: 280px; flex-shrink: 0;">
                        <div class="card h-100">
                            <div class="card-body p-2">
                                <h6 class="card-title mb-2 text-center">승률 차트</h6>
                                <div class="chart-container" style="height: calc(100% - 30px);">
                                    <canvas id="winrateChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Players Section -->
            <section id="players" class="mb-5">
                <h2 class="mb-4">
                    <i class="fas fa-users me-2"></i>
                    플레이어 목록
                </h2>
                <div class="d-flex justify-content-end mb-3">
                    <button class="btn btn-outline-secondary btn-sm" id="clearSelectionBtn">
                        <i class="fas fa-times-circle me-1"></i>선택 초기화
                    </button>
                </div>
                <!-- Player Details Display Area -->
                <div id="playerDetailsDisplayArea" class="card mb-4" style="display: none;">
                    <div class="card-body" id="playerDetailsContent">
                        <!-- Player details or comparison will be rendered here -->
                    </div>
                </div>
                <div class="row" id="playersList">
                    <!-- 동적으로 생성 -->
                </div>
            </section>


            <!-- Last Updated -->
            <div class="last-updated" id="lastUpdated">
                <!-- 동적으로 생성 -->
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- html2canvas for image capture -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script type="module" src="js/simple_app.js" defer></script>
</body>

</html>
